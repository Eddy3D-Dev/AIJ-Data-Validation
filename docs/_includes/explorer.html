{%- assign v = site.time | date: '%s' -%}
<style>
/* The point explorer (assets/js/explorer.js). Here, with the page, and not in the theme's stylesheet, which browsers keep for weeks. */
/* Every box below has a fixed height, and the page carries the skeleton itself: the script only fills it, so nothing on the
   page moves when it loads, when a point is hovered or when a quantity is chosen. */
.explorer { margin: 1rem 0 1.5rem; }
.explorer .explorer-note { font-size: .8rem; opacity: .75; }
.explorer .ex-controls { display: flex; flex-wrap: nowrap; gap: .5rem 1rem; align-items: center; height: 2rem; overflow-x: auto; overflow-y: hidden; white-space: nowrap; margin-bottom: .6rem; font-size: .8rem; }
.explorer .ex-controls button.ex-reset { font: inherit; font-size: .78rem; }
.explorer .ex-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: .75rem; }
.explorer .ex-panel { position: relative; height: 22rem; overflow: hidden; border: 1px solid rgba(128,128,128,.4); border-radius: 4px; }
.explorer .ex-scatter, .explorer .ex-3d { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
.explorer .ex-geo { position: absolute; bottom: .4rem; left: .5rem; font-size: .75rem; }
.explorer .ex-geo button { font: inherit; }
.explorer .ex-controls select { font: inherit; padding: .15rem .3rem; }
.explorer .ex-q { display: flex; flex-wrap: nowrap; gap: .25rem; }
.explorer .ex-q button { font: inherit; font-size: .78rem; padding: .15rem .55rem; border: 1px solid currentColor; border-radius: 1rem; background: none; color: inherit; cursor: pointer; opacity: .6; }
.explorer .ex-q button.on { opacity: 1; font-weight: 600; background: rgba(128,128,128,.18); }
.explorer .ex-title { position: absolute; top: .3rem; left: .5rem; font-size: .72rem; opacity: .7; pointer-events: none; }
.explorer .ex-legend { position: absolute; top: .3rem; right: .5rem; font-size: .7rem; opacity: .85; pointer-events: none; }
.explorer .ex-legend .bar { display: inline-block; width: 5rem; height: .5rem; vertical-align: middle; margin: 0 .3rem; background: linear-gradient(90deg, #2166ac, #f7f7f7, #b2182b); border: 1px solid rgba(128,128,128,.5); }
/* The readout has one fixed height, the text beside the table (stacked on a narrow screen, scrolling inside if it must), and
   its table keeps its columns: fixed widths, never the theme's min-width: 100 %, so a value's length (1.54e-5 against
   0.028) or a longer % never moves a column. */
.explorer .ex-readout { margin-top: .6rem; font-size: .78rem; height: 14rem; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 1.5rem; align-content: start; }
@media (max-width: 1000px) { .explorer .ex-readout { grid-template-columns: minmax(0, 1fr); } }
.explorer .ex-readout p { margin: 0 0 .4rem; }
.explorer .ex-readout table.ex-table { display: table; table-layout: fixed; width: 31rem; max-width: 100%; min-width: 0; border-collapse: collapse; margin: .3rem 0; }
.explorer .ex-readout th, .explorer .ex-readout td { min-width: 0; padding: .1rem .6rem .1rem 0; text-align: right; font-variant-numeric: tabular-nums; border: none; background: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.explorer .ex-readout th:first-child, .explorer .ex-readout td:first-child { text-align: left; }
.explorer .ex-readout .key { display: inline-block; width: .7rem; height: .2rem; margin-right: .3rem; vertical-align: middle; }
.explorer .ex-hint { font-size: .75rem; opacity: .7; }
</style>
<div class="explorer" data-case="{{ include.case }}" data-base="{{ '/' | relative_url }}" data-manifest="{{ '/assets/explorer/' | append: include.case | append: '.json' | relative_url }}?v={{ v }}">
  <div class="ex-controls"><label>Engine <select class="ex-view"></select></label><span class="ex-groups"></span><span class="ex-q"></span><button class="ex-reset" type="button">Reset view</button></div>
  <div class="ex-body" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:.75rem">
    <div class="ex-panel" style="position:relative;height:22rem;overflow:hidden"><canvas class="ex-scatter" style="display:block;position:absolute;inset:0;width:100%;height:100%"></canvas><div class="ex-title"></div><div class="ex-legend">model low<span class="bar"></span>model high</div></div>
    <div class="ex-panel" style="position:relative;height:22rem;overflow:hidden"><div class="ex-3d" style="display:block;position:absolute;inset:0;width:100%;height:100%"></div><div class="ex-title ex-title3d"></div><div class="ex-geo"></div></div>
  </div>
  <div class="ex-readout" style="height:14rem;overflow:auto"><div class="ex-hint">Loading the points… Hover a point to see where it sits in 3D and how the model differs from the measurement; click to pin it. This needs JavaScript; the figures on this page show the same scores.</div></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module" src="{{ '/assets/js/explorer.js' | relative_url }}?v={{ v }}"></script>
