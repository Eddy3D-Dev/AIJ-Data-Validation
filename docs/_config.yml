title: AIJ UWE
description: Validation data from the AIJ (Architectural Institute of Japan) benchmark cases—cleaned and packaged as an API.
url: "https://sustainableurbansystems.com"
baseurl: "/CFD-Test-Cases-Architectural-Institute-of-Japan-AIJ"

# GitHub's Jekyll build: remote theme (pinned to a release, so a new theme version cannot change the site by
# itself), whitelisted plugins only, no build step beyond Jekyll.
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-redirect-from

permalink: pretty
color_scheme: light
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
enable_copy_code_button: true

# Search: headings with a preview under each hit; Ctrl/Cmd+K focuses the box.
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: true
  focus_shortcut_key: "k"

# aux_links are written to the page as they are, so they carry the baseurl themselves.
aux_links:
  "API": "/CFD-Test-Cases-Architectural-Institute-of-Japan-AIJ/api-reference/"
  "Releases": "https://github.com/SustainableUrbanSystemsLab/CFD-Test-Cases-Architectural-Institute-of-Japan-AIJ/releases"
  "Repository": "https://github.com/SustainableUrbanSystemsLab/CFD-Test-Cases-Architectural-Institute-of-Japan-AIJ"

nav_external_links:
  - title: "Data paper (DOI)"
    url: "https://doi.org/10.1002/2475-8876.70083"
    opens_in_new_tab: true

# The footer line (and the edit link, which differs for generated and hand-written pages) is in
# docs/_includes/footer_custom.html.
footer_content: "Data: Kikumoto et al. (2026), CC BY 4.0. Collectors per case on each Data page."

# Callouts: {: .note }, {: .warning } or {: .important } before a paragraph; {: .warning-title } before a
# blockquote whose first paragraph is the title.
callouts:
  note:
    color: blue
  warning:
    color: yellow
  important:
    color: red

# Everything under api/ is static data; keep Jekyll from touching it beyond copying. Every other page gets the theme's
# default layout (GitHub's jekyll-default-layout does the same; this does not depend on that plugin).
keep_files:
  - api
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "api"
    values:
      layout: null
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
