name: Question about scoring
description: validation/score_submissions.py errors, scores something unexpected, or the docs do not say how to do something.
labels: [question]
body:
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command and the commit of your checkout.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: What it printed, and what you expected.
    validations:
      required: true
