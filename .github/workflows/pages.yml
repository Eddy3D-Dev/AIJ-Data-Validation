# Rebuild everything in the pinned environment and fail on any byte that differs from what is committed; check that
# the release version moves with the served content; build the Jekyll site under docs/ (which carries the static API
# under docs/api/) and deploy it to GitHub Pages; and when VERSION is new on main, tag it and publish the release.
# Pages must be set to "GitHub Actions" as its source (Settings -> Pages -> Source), which
# `gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow` also does.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every generated file (clean/, validation/figures/, docs/) is committed. This job regenerates all of them with
  # scripts/build_all.sh in the image pinned by digest in scripts/BUILD_IMAGE, with every package pinned by hash in
  # requirements.lock, and fails if the result differs from the commit by a single byte, if any document breaks its
  # schema, an index hash or a link, or if served content changed without the release version moving. The build writes
  # docs/api/<VERSION>/ (the frozen copy of this release) and docs/api/ (the latest alias); the copies of earlier
  # releases are never rebuilt, and the last step compares each with its tag.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the release tags, for the version check
      - name: Rebuild everything in the pinned environment
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$(cat scripts/BUILD_IMAGE)" bash scripts/build_all.sh
          sudo chown -R "$(id -u):$(id -g)" .
      - name: Nothing may differ from what is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::A fresh build differs from the commit. Run scripts/build_all.sh in the pinned image and commit the result."
            git status --porcelain
            git diff --stat
            # Keep the rebuilt bytes, so the owner can commit what CI produced (a figure drawn on another CPU can differ by a pixel).
            git status --porcelain --untracked-files=all | cut -c4- | tar czf "$RUNNER_TEMP/rebuilt-files.tar.gz" --ignore-failed-read -T -
            exit 1
          fi
      - name: Upload what the rebuild changed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-files
          path: ${{ runner.temp }}/rebuilt-files.tar.gz
          if-no-files-found: ignore
      - name: The version moves with the change
        run: python3 scripts/release.py check

  build:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A release is the deployed commit whose VERSION has no tag yet: tag it vX.Y.Z and publish its CHANGELOG.md section
  # with the archive (aij-uwe-vX.Y.Z.tar.gz) and its SHA256SUMS, built in the pinned image so the bytes are reproducible.
  release:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and publish the release if VERSION is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(python3 scripts/release.py version)"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already released"
            exit 0
          fi
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p dist
          docker run --rm -e SOURCE_DATE_EPOCH -v "$PWD:/w" -w /w "$(cat scripts/BUILD_IMAGE)" \
            python scripts/release.py archive dist
          python3 scripts/release.py notes > dist/NOTES.md
          gh release create "v$v" --target "$GITHUB_SHA" --title "v$v" --notes-file dist/NOTES.md \
            "dist/aij-uwe-v$v.tar.gz" "dist/aij-uwe-v$v.SHA256SUMS"
