# Every build in this repository runs in ONE environment: clean/build.py (the cleaned release),
# scripts/build_api.py (the API under docs/api/) and validation/*.py (the figures). These are the direct
# dependencies, pinned exactly; uv.lock pins every transitive one with its hashes and is what CI installs
# (`uv sync --frozen`). Regenerate the lock after changing a pin here:
#   uv lock
# Python itself is pinned in .python-version (CI runs the matching container image, pinned by digest).
[project]
name = "aij-data-validation"
version = "0.0.0"   # not a package: the release version is VERSION
description = "Build environment of the AIJ urban wind validation data and API."
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "xlrd==2.0.2",            # BIFF8 .xls workbooks (openpyxl cannot read them)
    "rhino3dm==8.35.0",       # Case E: case-e.3dm
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.7.2",
    "matplotlib==3.11.2",
    "pillow==13.0.0",         # scripts/build_api.py: the 1600 px web copies of the figures (matplotlib needs it too)
    "ultraplot==2.7.1",
]

[tool.uv]
package = false
# Transitive pins carried over from the former requirements.lock (nothing here is imported by a build).
constraint-dependencies = ["certifi==2026.7.22"]
